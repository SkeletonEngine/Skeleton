# GitHub Action to run cpplint on all pushes and pull requests

name: lint
on: [push, pull_request]
jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - run: pip install cpplint
    - run: cpplint --recursive --linelength=120 --filter=-build/include_order,-readability/inheritance,-whitespace/indent_namespace file skeleton/src skeleton/include